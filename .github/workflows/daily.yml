name: Print the paper

on:
  schedule:
    # GitHub runs scheduled jobs late at busy times (hours, sometimes), so print every hour at an
    # off-peak minute: there is always a fresh edition waiting whenever you open the paper.
    - cron: "17 * * * *"
  workflow_dispatch: {}        # "Run workflow" button = refresh now (the watchdog uses it too)
  push:
    branches: [main]
    paths-ignore: ["archive/**", "README.md", "CONTRACT.md", "watchdog.py", ".github/workflows/watchdog.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

# The newest run always wins. On 30 Sep a run got stuck "waiting for github-pages deployment
# approval" (a GitHub-side hang, since no approval is configured), and with cancel-in-progress
# off, every later run queued behind it for three days. Now the next run cancels a stuck one.
concurrency:
  group: print-the-paper
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # pinned: no surprise when ubuntu-latest moves to a new release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        continue-on-error: true   # if this ever fails, the runner's own python3 (3.12 on 24.04) is used
        with:
          python-version: "3.12"

      - name: Build today's edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TZ: Asia/Kolkata
        run: python3 build.py

      - name: Check the page before publishing (a broken page is never published)
        run: python3 check_site.py site

      - name: Save edition to archive (also keeps the schedule alive)
        env:
          TZ: Asia/Kolkata
        run: |
          git config user.name  "pole-position-bot"
          git config user.email "actions@users.noreply.github.com"
          git add archive
          if ! git diff --cached --quiet; then
            git commit -m "Edition $(date +'%Y-%m-%d %H:%M IST')"
            git pull --rebase --quiet || git rebase --abort || true
            git push || echo "archive push skipped"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # pinned: no surprise when ubuntu-latest moves to a new release
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
